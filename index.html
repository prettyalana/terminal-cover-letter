<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alana Edwards LeanTaaS Cover Letter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/ab9c75fe83.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="menu-bar">
            <div class="logo">
                <i class=" fa-regular fa-heart fa-bounce"></i>
                Alana Edwards OS
            </div>

            <div class="nav-tabs">
                <ul>
                    <li id="date-time">

                    </li>
                    <li class="deco-item">File</li>
                    <li class="deco-item">Edit</li>
                    <li class="deco-item">View</li>
                </ul>
            </div>
        </div>
    </header>

    <div class="desktop">

        <div class="applications-wrapper">

            <!-- Maybe add other widgets  -->

            <div class="cover-letter">
                <button>
                    <a href="documents/Alana_Edwards_LeanTaaS_Cover_Letter.pdf" target="_blank">
                        <img src="assets/document.png" alt="document icon">
                        <p>Associate GTM Engineer Cover Letter </p>
                    </a>
                </button>
            </div>
            <div class="terminal">
                <button id="terminal-button">

                    <img src="assets/terminal.png" alt="terminal icon">
                    <p>Terminal</p>

                </button>
            </div>
        </div>

        <div id="terminal-window">
            <div class="terminal-titlebar">
                <div class="apple-button-wrapper">
                    <button class="close-button" aria-label="Close terminal">
                        <img src="assets/1-close-1-normal.svg" class="apple-button" alt="">
                    </button>
                    <button class="minimize-button" aria-label="Minimize terminal">
                        <img src="assets/2-minimize-1-normal.svg" class="apple-button" alt="">
                    </button>
                    <button class="maximize-button" aria-label="Expand terminal">
                        <img src="assets/3-maximize-1-normal.svg" class="apple-button" alt="">
                    </button>
                </div>
                <span class="terminal-title"><img src="assets/terminal-2.png" class="dark-mode-terminal"
                        alt="terminal in dark mode">Alana's
                    Terminal</span>
            </div>

            <div id="terminal-content">
                <div class="welcome-text">
                    <h2>
                        Welcome to Alana OS ♡
                    </h2>
                    <h3>Associate GTM Engineer Candidate | Software Engineer | Creative Problem Solver</h3>
                    <span>Type a command to get started:</span>
                    <br>
                    <code class="cover-letter-text">cover-letter</code>
                    <!-- <span>View my cover letter in the terminal</span>
                    <code>get cover-letter</code>
                    <span>Open the PDF version in your browser</span>
                    <code>help</code>
                    <span>See available commands</span> -->
                </div>

                <div id="output-area">

                    <a id="cover-letter-display" href="documents/Alana_Edwards_LeanTaaS_Cover_Letter.pdf">
                    </a>
                </div>

                <form class="input-field">
                    <span class="prompt-wrapper">
                        <code class="input-title">alana@Alana-OS ~ %</code>
                        <code id="input-text"></code>
                        <span id="cursor"></span>
                    </span>

                    <input id="terminal-input" type="text" aria-label="Terminal command" autocomplete="off"
                        autocapitalize="off" autocorrect="off" spellcheck="false">
                </form>

                <code id="terminal-output">

                </code>
            </div>
        </div>

    </div>

    <div class="bottom-dock">
        <!-- My footer goes here -->
        <!-- attribution -->
        <!-- <a href="https://www.flaticon.com/free-icons/terminal" title="terminal icons">Terminal icons created by Icon Mela - Flaticon</a> -->
        <!-- <a href="https://www.flaticon.com/free-icons/document" title="document icons">Document icons created by Magnific - Flaticon</a> -->
        <!-- <a href="https://www.flaticon.com/free-icons/terminal" title="terminal icons">Terminal icons created by Royyan Wijaya - Flaticon</a> -->
    </div>

    <script src="script.js"></script>
</body>

</html>
